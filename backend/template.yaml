          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [{ prefix: aegisgrid. }]
            RetryPolicy: { MaximumRetryAttempts: 4, MaximumEventAgeInSeconds: 900 }
            DeadLetterConfig: { Arn: !GetAtt EventsDLQ.Arn }

  AnalyticsExportFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/platform/analytics-export.ts]
    Properties:
      Handler: analytics-export.handler
      Description: "DynamoDB Streams -> S3 analytics lake (Glue catalog, queryable with Athena)"
      Policies:
        - S3WritePolicy: { BucketName: !Ref AnalyticsBucket }
        - SQSSendMessagePolicy: { QueueName: !GetAtt EventsDLQ.QueueName }
      Events:
        IncidentStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt IncidentsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 50
            MaximumBatchingWindowInSeconds: 10
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            DestinationConfig: { OnFailure: { Destination: !GetAtt EventsDLQ.Arn } }


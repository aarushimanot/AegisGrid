  # ---------------------------------------------------------------- Monitoring
  AssessIncidentErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-AssessIncident-errors
      AlarmDescription: AssessIncidentFunction is failing; requests may not reach or progress at stations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AssessIncidentFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  StationOffersErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-StationOffers-errors
      AlarmDescription: StationOffersFunction is failing; requests may not reach or progress at stations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref StationOffersFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  AdminApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-AdminApi-errors
      AlarmDescription: AdminApiFunction is failing; requests may not reach or progress at stations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref AdminApiFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  OfferSweeperErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-OfferSweeper-errors
      AlarmDescription: OfferSweeperFunction is failing; requests may not reach or progress at stations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref OfferSweeperFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  NotifierErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-Notifier-errors
      AlarmDescription: NotifierFunction is failing; requests may not reach or progress at stations.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref NotifierFunction }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AnalysisFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-analysis-failed
      AlarmDescription: An incident analysis workflow failed; the control room was escalated.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref IncidentAnalysisStateMachine }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  EventsDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-events-dlq
      AlarmDescription: Agent events could not be delivered after retries.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EventsDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aegisgrid-${Stage}-api-5xx
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions: [{ Name: ApiName, Value: !Sub "aegisgrid-${Stage}-api" }]
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub aegisgrid-${Stage}-operations
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Incident workflows", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${IncidentAnalysisStateMachine}"],
                  [".", "ExecutionsSucceeded", ".", "."],
                  [".", "ExecutionsFailed", ".", "."] ] } },
            { "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": { "title": "Workflow duration (ms)", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["AWS/States", "ExecutionTime", "StateMachineArn", "${IncidentAnalysisStateMachine}", { "stat": "p50" }],
                  ["...", { "stat": "p95" }] ] } },
            { "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Agent invocations", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${AmbulanceAgentFunction}"],
                  ["...", "${FireAgentFunction}"],
                  ["...", "${PoliceAgentFunction}"],
                  ["...", "${TrafficPoliceAgentFunction}"],
                  ["...", "${HospitalAgentFunction}"],
                  ["...", "${DisasterResponseAgentFunction}"],
                  ["...", "${WomenChildSafetyAgentFunction}"],
                  ["...", "${UtilityEmergencyAgentFunction}"] ] } },
            { "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": { "title": "Agent errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${AmbulanceAgentFunction}"],
                  ["...", "${FireAgentFunction}"],
                  ["...", "${PoliceAgentFunction}"],
                  ["...", "${TrafficPoliceAgentFunction}"],
                  ["...", "${HospitalAgentFunction}"],
                  ["...", "${DisasterResponseAgentFunction}"],
                  ["...", "${WomenChildSafetyAgentFunction}"],
                  ["...", "${UtilityEmergencyAgentFunction}"],
                  ["...", "${AssessIncidentFunction}"] ] } },
            { "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": { "title": "Bedrock assessment latency (ms)", "region": "${AWS::Region}", "period": 300,
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${AssessIncidentFunction}", { "stat": "p50" }],
                  ["...", { "stat": "p95" }] ] } },
            { "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": { "title": "API requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "aegisgrid-${Stage}-api"],
                  [".", "4XXError", ".", "."],
                  [".", "5XXError", ".", "."] ] } }
          ]
        }

  # ---------------------------------------------------------------- Analytics (Athena / QuickSight)
  AnalyticsDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub aegisgrid_${Stage}
        Description: AegisGrid incident analytics

  IncidentsAnalyticsTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AnalyticsDatabase
      TableInput:
        Name: incidents
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: json
          projection.enabled: "true"
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: 2026-01-01,NOW
          projection.dt.interval: "1"
          projection.dt.interval.unit: DAYS
          storage.location.template: !Sub "s3://${AnalyticsBucket}/incidents/dt=${!dt}/"
        PartitionKeys: [{ Name: dt, Type: string }]
        StorageDescriptor:
          Location: !Sub "s3://${AnalyticsBucket}/incidents/"
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo: { SerializationLibrary: org.openx.data.jsonserde.JsonSerDe }
          Columns:
            - { Name: incident_id, Type: string }
            - { Name: status, Type: string }
            - { Name: created_at, Type: string }
            - { Name: updated_at, Type: string }
            - { Name: resolved_at, Type: string }
            - { Name: incident_type, Type: string }
            - { Name: severity, Type: int }
            - { Name: confidence, Type: int }
            - { Name: estimated_casualties, Type: int }
            - { Name: assessment_source, Type: string }
            - { Name: required_agents, Type: string }
            - { Name: language, Type: string }
            - { Name: media_count, Type: int }
            - { Name: latitude, Type: double }
            - { Name: longitude, Type: double }
            - { Name: ambulance_eta_min, Type: int }
            - { Name: police_eta_min, Type: int }
            - { Name: fire_eta_min, Type: int }
            - { Name: hospital_id, Type: string }
            - { Name: signals_held, Type: int }
            - { Name: units_dispatched, Type: int }
            - { Name: time_to_dispatch_min, Type: double }
            - { Name: time_to_resolve_min, Type: double }

  AnalyticsWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub aegisgrid-${Stage}
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${AnalyticsBucket}/athena-results/"
          EncryptionConfiguration: { EncryptionOption: SSE_S3 }

  # ---------------------------------------------------------------- Cost guard
  SpendingBudget:
    Type: AWS::Budgets::Budget
    Condition: HasAlarmEmail
    Properties:
      Budget:
        BudgetName: !Sub aegisgrid-${Stage}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlarmEmail }]

  # ---------------------------------------------------------------- Frontend hosting (S3 + CloudFront)
  # The React app is served from a private S3 bucket through CloudFront (Always Free:
  # 1 TB / 10M requests a month). HTTPS is required for the browser's GPS and microphone APIs,
  # which a plain S3 website endpoint (HTTP only) cannot provide.
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aegisgrid-${Stage}-web-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub aegisgrid-${Stage}-web-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub AegisGrid ${Stage} web app
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        # Single-page app: unknown paths (e.g. /incidents/123) serve index.html
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt FrontendBucket.Arn, !Sub "${FrontendBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

Outputs:
  WebsiteUrl:
    Description: Public HTTPS URL of the AegisGrid web app (after running scripts/deploy-frontend.sh)
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  ApiUrl:
    Description: Base URL of the AegisGrid REST API
    Value: !Sub "https://${AegisApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Hosted sign-in domain (frontend VITE_COGNITO_DOMAIN)
    Value: !Sub "${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
  GoogleRedirectUri:
    Description: Add this as an Authorized redirect URI on the Google OAuth client
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
  GoogleSignInEnabled:
    Value: !If [HasGoogle, "true", "false"]
  IncidentsTableName:
    Value: !Ref IncidentsTable
  StationsTableName:
    Value: !Ref StationsTable
  OffersTableName:
    Value: !Ref OffersTable
  TimelineTableName:
    Value: !Ref TimelineTable
  MediaBucketName:
    Value: !Ref MediaBucket
  AnalyticsBucketName:
    Value: !Ref AnalyticsBucket
  EventBusName:
    Value: !Ref EventBus
  StateMachineArn:
    Value: !Ref IncidentAnalysisStateMachine
  DispatchTopicArn:
    Description: Subscribe departments here with a filter policy on the `department` attribute
    Value: !Ref DispatchTopic
  DepartmentDirectoryParameter:
    Value: !Ref DepartmentDirectoryParameter
  AthenaWorkGroup:
    Value: !Ref AnalyticsWorkGroup
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=aegisgrid-${Stage}-operations"

            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action: sns:Publish
              NotResource: "arn:aws:sns:*:*:*"
      Events:
        OnNotifiableEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref EventBus
            Pattern:
              source: [{ prefix: aegisgrid. }]
              detail-type: [Incident.Assessed, Incident.AnalysisFailed, Incident.Resolved, Offer.Created, Offer.Accepted, Offer.Transferred, Offer.Expired, Service.Arrived, Service.Completed, Service.Unavailable, Service.FalseAlarm, Incident.DuplicateLinked, Station.Submitted, Station.Reviewed]

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  AegisGrid - AI-powered multi-agent emergency response platform.
  Serverless, free-tier-first: Lambda, DynamoDB (provisioned within Always Free), SNS, SQS,
  Step Functions, Cognito, CloudWatch, X-Ray, SSM Parameter Store, EventBridge Scheduler and
  CloudFront are Always Free at this scale; API Gateway, EventBridge events, S3, Rekognition,
  Transcribe, Comprehend, Translate and Bedrock (Amazon Nova) are pay-per-use, costing
  fractions of a cent per incident and covered by new-account credits. No fixed monthly charges.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "[a-z0-9-]+"
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: >
      Bedrock model. amazon.nova-* works on a Free-plan account (billed directly by AWS, covered by credits).
      anthropic.claude-* (e.g. anthropic.claude-opus-5-5) needs a Paid-plan account (sold via AWS Marketplace).
  BedrockRegion:
    Type: String
    Default: ""
    Description: Region for Bedrock calls. Empty = the stack's region.
  AgentBriefings:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Agents ask Claude for a short responder briefing with each dispatch.
  SesSenderEmail:
    Type: String
    Default: ""
    Description: Verified SES identity used as From address. Empty disables email.
  ControlRoomEmail:
    Type: String
    Default: ""
    Description: Optional email subscribed to CONTROL_ROOM alerts on the dispatch topic.
  CitizenSms:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable SMS (citizen updates and station phone verification). Costs money; needs SNS SMS production access.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email for CloudWatch alarms and the AWS Budgets spending alert.
  MonthlyBudgetUsd:
    Type: Number
    Default: 1
    Description: Email AlarmEmail when actual or forecast monthly spend passes this many USD.
  CorsOrigin:
    Type: String
    Default: "*"
  AdminEmail:
    Type: String
    Default: ""
    Description: The platform owner's email. Creates the single admin account (temporary password sent by email).
  GoogleClientId:
    Type: String
    Default: ""
    Description: OAuth 2.0 Web client ID from Google Cloud Console. Empty disables "Continue with Google".
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: OAuth 2.0 client secret matching GoogleClientId.

Conditions:
  HasBedrockRegion: !Not [!Equals [!Ref BedrockRegion, ""]]
  HasControlRoomEmail: !Not [!Equals [!Ref ControlRoomEmail, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, ""]]

Globals:
  Function:
    CodeUri: ./
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 20
    Tracing: Active
    Environment:
      Variables:
        STAGE: !Ref Stage
        NODE_OPTIONS: --enable-source-maps
        INCIDENTS_TABLE: !Ref IncidentsTable
        STATIONS_TABLE: !Ref StationsTable
        OFFERS_TABLE: !Ref OffersTable
        CITIZENS_TABLE: !Ref CitizensTable
        USER_POOL_ID: !Ref UserPool
        SMS_ENABLED: !Ref CitizenSms
        TIMELINE_TABLE: !Ref TimelineTable
        MEDIA_BUCKET: !Ref MediaBucket
        ANALYTICS_BUCKET: !Ref AnalyticsBucket
        EVENT_BUS_NAME: !Ref EventBus
        DISPATCH_TOPIC_ARN: !Ref DispatchTopic
        DIRECTORY_PARAMETER: !Ref DepartmentDirectoryParameter
        SES_SENDER: !Ref SesSenderEmail
        CITIZEN_SMS: !Ref CitizenSms
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_REGION: !If [HasBedrockRegion, !Ref BedrockRegion, !Ref AWS::Region]
        AGENT_BRIEFINGS: !Ref AgentBriefings
        CORS_ORIGIN: !Ref CorsOrigin

Resources:
  # ---------------------------------------------------------------- Security
  # No customer-managed KMS key (that would be $1/month). Data is still encrypted at rest:
  # S3 with SSE-S3, DynamoDB with AWS-owned keys, the dispatch SNS topic with the AWS-managed
  # aws/sns KMS key, and the department directory can be a SecureString (aws/ssm KMS key).
  DepartmentDirectoryParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /aegisgrid/${Stage}/department-directory
      Description: Responder contact directory (emails per department) used by the notifier.
      Type: String
      Tier: Standard
      Value: '{"CONTROL_ROOM":{"emails":[]},"AMBULANCE":{"emails":[]},"HOSPITAL":{"emails":[]},"POLICE":{"emails":[]},"FIRE":{"emails":[]},"TRAFFIC":{"emails":[]}}'

  # One user pool for all three account types. Self-registered accounts are citizens;
  # help-service and admin accounts are placed in groups by an administrator.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain # accounts survive a stack delete or a replacing update
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub aegisgrid-${Stage}-users
      LambdaConfig:
        PostAuthentication: !GetAtt AuthActivityFunction.Arn
        PostConfirmation: !GetAtt AuthActivityFunction.Arn
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your AegisGrid verification code
        EmailMessage: "Your AegisGrid verification code is {####}"
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        # At least 8 characters with an uppercase letter, a number and a special symbol.
        PasswordPolicy: { MinimumLength: 8, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true, RequireLowercase: false, TemporaryPasswordValidityDays: 7 }
      Schema:
        - { Name: name, AttributeDataType: String, Mutable: true, Required: false }
        - { Name: phone_number, AttributeDataType: String, Mutable: true, Required: false }
        # "true" = the citizen allows live GPS location when they don't type a location
        - { Name: live_location, AttributeDataType: String, Mutable: true, StringAttributeConstraints: { MinLength: "4", MaxLength: "5" } }
        # "citizen" or "service", chosen at sign-up and fixed. A service account only becomes active
        # after the admin approves its verified station (membership of ServiceProviders).
        - { Name: account_type, AttributeDataType: String, Mutable: false, StringAttributeConstraints: { MinLength: "6", MaxLength: "8" } }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub aegisgrid-${Stage}-${AWS::AccountId}

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: aegisgrid-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 8
      IdTokenValidity: 8
      RefreshTokenValidity: 30
      TokenValidityUnits: { AccessToken: hours, IdToken: hours, RefreshToken: days }
      # Hosted sign-in, used for "Continue with Google" (authorization code + PKCE)
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile, aws.cognito.signin.user.admin]
      CallbackURLs:
        - http://localhost:5173/auth/callback
        - !Sub "https://${FrontendDistribution.DomainName}/auth/callback"
      LogoutURLs:
        - http://localhost:5173/login
        - !Sub "https://${FrontendDistribution.DomainName}/login"
      # !Ref on the provider (only when enabled) also orders creation after it
      SupportedIdentityProviders: !If [HasGoogle, [COGNITO, !Ref GoogleIdentityProvider], [COGNITO]]

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: Admins, Precedence: 0, Description: Platform owner. Never self-assigned. }
  ServiceProvidersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: ServiceProviders, Precedence: 10, Description: Help-service stations approved by the admin }

  # The one admin account (the platform owner), created at deployment.
  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: HasAdminEmail
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref AdminEmail }
        - { Name: email_verified, Value: "true" }
        - { Name: name, Value: AegisGrid Admin }
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: HasAdminEmail
    Properties: { UserPoolId: !Ref UserPool, GroupName: !Ref AdminsGroup, Username: !Ref AdminUser }

  # ---------------------------------------------------------------- Storage
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aegisgrid-${Stage}-media-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRawMedia
            Status: Enabled
            Prefix: incidents/
            ExpirationInDays: 365
          - Id: ExpireTranscripts
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 90

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt MediaBucket.Arn, !Sub "${MediaBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub aegisgrid-${Stage}-analytics-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAthenaResults
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 30

  AnalyticsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AnalyticsBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt AnalyticsBucket.Arn, !Sub "${AnalyticsBucket.Arn}/*"]
            Condition: { Bool: { aws:SecureTransport: "false" } }

  # Provisioned capacity across the 5 tables and 5 indexes adds up to 25 RCU / 25 WCU,
  # exactly the DynamoDB Always Free allowance. Encrypted at rest with AWS-owned keys (free).
  # Every table is retained if the stack is deleted or a change would replace it, so stored
  # history is never lost by a redeploy. TimelineTable also holds each account's activity log.
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub aegisgrid-${Stage}-incidents
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 3, WriteCapacityUnits: 3 }
      AttributeDefinitions:
        - { AttributeName: incidentId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
        - { AttributeName: reporterId, AttributeType: S }
      KeySchema: [{ AttributeName: incidentId, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: ByStatus
          KeySchema: [{ AttributeName: status, KeyType: HASH }, { AttributeName: createdAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 3, WriteCapacityUnits: 3 }
        - IndexName: ByReporter
          KeySchema: [{ AttributeName: reporterId, KeyType: HASH }, { AttributeName: createdAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 3, WriteCapacityUnits: 3 }
      StreamSpecification: { StreamViewType: NEW_IMAGE }

  StationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub aegisgrid-${Stage}-stations
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 3, WriteCapacityUnits: 3 }
      AttributeDefinitions:
        - { AttributeName: stationId, AttributeType: S }
        - { AttributeName: serviceType, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
      KeySchema: [{ AttributeName: stationId, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: ByTypeStatus
          KeySchema: [{ AttributeName: serviceType, KeyType: HASH }, { AttributeName: status, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }

  OffersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub aegisgrid-${Stage}-offers
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 3, WriteCapacityUnits: 3 }
      AttributeDefinitions:
        - { AttributeName: offerId, AttributeType: S }
        - { AttributeName: stationId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: expiresAt, AttributeType: S }
      KeySchema: [{ AttributeName: offerId, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: ByStation
          KeySchema: [{ AttributeName: stationId, KeyType: HASH }, { AttributeName: createdAt, KeyType: RANGE }]
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
        - IndexName: ByStatusExpiry
          KeySchema: [{ AttributeName: status, KeyType: HASH }, { AttributeName: expiresAt, KeyType: RANGE }]
          Projection: { ProjectionType: KEYS_ONLY }
          ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }

  # Citizen trust score, standing, verified phone and recent request times (misuse protection).
  CitizensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub aegisgrid-${Stage}-citizens
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
      KeySchema: [{ AttributeName: userId, KeyType: HASH }]

  TimelineTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub aegisgrid-${Stage}-timeline
      BillingMode: PROVISIONED
      ProvisionedThroughput: { ReadCapacityUnits: 2, WriteCapacityUnits: 2 }
      AttributeDefinitions:
        - { AttributeName: incidentId, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema: [{ AttributeName: incidentId, KeyType: HASH }, { AttributeName: sk, KeyType: RANGE }]

  # ---------------------------------------------------------------- Messaging
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub aegisgrid-${Stage}

  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub aegisgrid-${Stage}-events-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  EventsDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventsDLQ]
      PolicyDocument:
        Statement:
          - Sid: AllowEventBridgeDeadLetters
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EventsDLQ.Arn
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }

  DispatchTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub aegisgrid-${Stage}-dispatch
      DisplayName: AegisGrid
      KmsMasterKeyId: alias/aws/sns

  ControlRoomSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasControlRoomEmail
    Properties:
      TopicArn: !Ref DispatchTopic
      Protocol: email
      Endpoint: !Ref ControlRoomEmail
      FilterPolicy: { department: [CONTROL_ROOM] }

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub aegisgrid-${Stage}-alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties: { TopicArn: !Ref AlarmTopic, Protocol: email, Endpoint: !Ref AlarmEmail }

  # ---------------------------------------------------------------- API
  AegisApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub aegisgrid-${Stage}-api
      StageName: !Ref Stage
      TracingEnabled: true
      EndpointConfiguration: { Type: REGIONAL }
      Cors:
        AllowOrigin: !Sub "'${CorsOrigin}'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,PUT,PATCH,OPTIONS'"
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
          MetricsEnabled: true
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers: { Access-Control-Allow-Origin: !Sub "'${CorsOrigin}'", Access-Control-Allow-Headers: "'Content-Type,Authorization'" }
        DEFAULT_5XX:
          ResponseParameters:
            Headers: { Access-Control-Allow-Origin: !Sub "'${CorsOrigin}'", Access-Control-Allow-Headers: "'Content-Type,Authorization'" }

  # ---------------------------------------------------------------- Orchestration
  IncidentAnalysisStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub aegisgrid-${Stage}-incident-analysis
      Type: STANDARD
      DefinitionUri: statemachine/incident-analysis.asl.json
      DefinitionSubstitutions:
        PrepareAnalysisFunctionArn: !GetAtt PrepareAnalysisFunction.Arn
        AnalyzeImageFunctionArn: !GetAtt AnalyzeImageFunction.Arn
        FetchTranscriptFunctionArn: !GetAtt FetchTranscriptFunction.Arn
        AnalyzeTextFunctionArn: !GetAtt AnalyzeTextFunction.Arn
        AssessIncidentFunctionArn: !GetAtt AssessIncidentFunction.Arn
        MarkFailedFunctionArn: !GetAtt MarkFailedFunction.Arn
        MediaBucket: !Ref MediaBucket
        EventBusName: !Ref EventBus
      Tracing: { Enabled: true }
      Logging:
        Level: ERROR
        IncludeExecutionData: false
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt StateMachineLogGroup.Arn }
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref PrepareAnalysisFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref AnalyzeImageFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref FetchTranscriptFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref AnalyzeTextFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref AssessIncidentFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref MarkFailedFunction }
        - EventBridgePutEventsPolicy: { EventBusName: !Ref EventBus }
        - Statement:
            - Effect: Allow
              Action: [transcribe:StartTranscriptionJob, transcribe:GetTranscriptionJob]
              Resource: "*"
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/incidents/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/transcripts/*"
            - Effect: Allow
              Action: [logs:CreateLogDelivery, logs:GetLogDelivery, logs:UpdateLogDelivery, logs:DeleteLogDelivery, logs:ListLogDeliveries, logs:PutResourcePolicy, logs:DescribeResourcePolicies, logs:DescribeLogGroups]
              Resource: "*"

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/states/aegisgrid-${Stage}-incident-analysis
      RetentionInDays: 7

  # ---------------------------------------------------------------- Functions
  CreateIncidentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/create-incident.ts]
    Properties:
      Handler: create-incident.handler
      Description: "POST /incidents - signed-in citizen requests emergency help"
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentAnalysisStateMachine
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TimelineTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IncidentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CitizensTable }
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${MediaBucket.Arn}/incidents/*"
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref IncidentAnalysisStateMachine
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/incidents", Method: post, Auth: { Authorizer: CognitoAuthorizer } }

  SubmitIncidentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/submit-incident.ts]
    Properties:
      Handler: submit-incident.handler
      Description: "POST /incidents/{incidentId}/submit - start analysis after media upload"
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref IncidentAnalysisStateMachine
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref IncidentsTable }
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${MediaBucket.Arn}/incidents/*"
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt MediaBucket.Arn
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref IncidentAnalysisStateMachine
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/incidents/{incidentId}/submit", Method: post, Auth: { Authorizer: CognitoAuthorizer } }

  GetIncidentStatusFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/get-incident-status.ts]
    Properties:
      Handler: get-incident-status.handler
      Description: "GET /incidents/{incidentId}/status - live status for the requesting citizen"
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref IncidentsTable }
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/incidents/{incidentId}/status", Method: get, Auth: { Authorizer: CognitoAuthorizer } }

  ListMyIncidentsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/list-my-incidents.ts]
    Properties:
      Handler: list-my-incidents.handler
      Description: "GET /me/incidents - citizen request history with response times"
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref IncidentsTable }
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/me/incidents", Method: get, Auth: { Authorizer: CognitoAuthorizer } }

  UpdateMyLocationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/update-my-location.ts]
    Properties:
      Handler: update-my-location.handler
      Description: "PATCH /me/incidents/{incidentId}/location - live GPS from the citizen's device"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref IncidentsTable }
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/me/incidents/{incidentId}/location", Method: patch, Auth: { Authorizer: CognitoAuthorizer } }

  ListServicesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: true
        EntryPoints: [src/handlers/api/list-services.ts]
    Properties:
      Handler: list-services.handler
      Description: "GET /services - the eight services and their approved stations"
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref StationsTable }
      Events:
        Api:
          Type: Api
          Properties: { RestApiId: !Ref AegisApi, Path: "/services", Method: get, Auth: { Authorizer: CognitoAuthorizer } }


    Properties:
      Handler: notifier.handler
      Description: "Notifier: SNS per service, SES to stations, optional citizen SMS"
      Timeout: 30
      Policies:
        - SNSPublishMessagePolicy: { TopicName: !GetAtt DispatchTopic.TopicName }
